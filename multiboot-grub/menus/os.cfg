set installroot="${installsrc}${osroot}"
set vmlinuz="${osroot}/images/pxeboot/vmlinuz"
set initrdimg="${osroot}/images/pxeboot/initrd.img"
export installroot
export vmlinuz
export initrdimg

for ks in /kickstarts/*.ks; do
menuentry "$ks" "$ks" {
    set ksfile="${installroot}${2}"
    linux $vmlinuz inst.stage2=$installroot inst.repo=$installroot inst.ks=$ksfile
    initrd $initrdimg
}
done

menuentry 'Interactive Install' {
    linux $vmlinuz inst.stage2=$osroot inst.repo=$osroot
    initrd $initrdimg
}

menuentry 'Rescue System' {
    linux $vmlinuz inst.rescue
    initrd $initrdimg
}
