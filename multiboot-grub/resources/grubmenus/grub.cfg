set default=0
set timeout=30
set grubmenus=/resources/grubmenus

insmod all_video
insmod gfxterm
insmod regexp
insmod linux

search --no-floppy --label INSTALL --set=root
set installsrc="hd:LABEL=INSTALL:"
export installsrc

submenu 'Red Hat Enterprise Linux' {
    set distro=rhel
    # TODO
}
submenu 'Rocky Linux' {
    set distro=rocky
    # TODO
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
menuentry 'Memtest86+' {
    linux /resources/
}
menuentry 'Reboot' {
    reboot
}
menuentry 'Power Off' {
    halt
}
