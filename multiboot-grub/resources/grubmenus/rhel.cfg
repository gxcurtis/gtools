set default=1
set timeout=30
set ksdir=/resources/kickstarts
export ksdir

insmod all_video
insmod gfxterm
insmod regexp
insmod linux

function make_submenu {
    set osroot="${installsrc}${installroot}"
    set vmlinuz="${osroot}/images/pxeboot/vmlinuz"
    set initrd="${osroot}/images/pxeboot/initrd.img"
    
    submenu 'Kickstarts' {
        for ks in $ksdir/*.ks; do
            menuentry "$ks" "$ks" {
                set ksfile="${installsrc}${2}"
                linux $vmlinuz inst.stage2=$osroot inst.repo=$osroot inst.ks=$ksfile
                initrd $initrd
            }
        done
    }
    menuentry 'Interactive Install' {
        linux $vmlinuz inst.stage2=$osroot inst.repo=$osroot
        initrd $initrd
    }
    menuentry 'Rescue Mode' {
        linux $vmlinuz inst.stage2=$osroot inst.rescue
        initrd $initrd
    }
}

search --no-floppy --label INSTALL --set=root
installsrc='hd:LABEL=INSTALL:'

submenu 'Red Hat Enterprise Linux 10' {
    set installroot=/rhel/10
    make_submenu
}
submenu 'Red Hat Enterprise Linux 9' {
    set installroot=/rhel/9
    make_submenu
}
submenu 'Red Hat Enterprise Linux 8' {
    set installroot=/rhel/8
    make_submenu
}
submenu 'Red Hat Enterprise Linux 7' {
    set installroot=/rhel/7
    make_submenu
}
menuentry 'Memtest86+' {

}
menuentry 'Shell' {

}
menuentry 'Reboot' {

}
