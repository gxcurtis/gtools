set default=1
set timeout=30

insmod all_video
insmod gfxterm
insmod gfxterm_background
insmod regexp
insmod linux
insmod png

search --no-floppy --label INSTALL --set=root

set gfxmode=1024x768
terminal_output gfxterm

background_image /resources/graphics/rhel-background.png

function make_submenu {
    set installroot="${installsrc}${osroot}"
    set vmlinuz="${osroot}/images/pxeboot/vmlinuz"
    set initrd="${osroot}/images/pxeboot/initrd.img"

    export installroot
    export vmlinuz
    export initrd
    
    submenu 'Kickstarts' {
        for ks in $ksdir/*.ks; do
            regexp --set=1:ksfile '^.*/(.*\.ks)$' "$ks"
            menuentry "$ksfile" "${installsrc}${ks}" {
                linux $vmlinuz inst.stage2=$installroot inst.repo=$installroot inst.ks=$2
                initrd $initrd
            }
        done
    }
    menuentry 'Interactive Install' {
        linux $vmlinuz inst.stage2=$installroot inst.repo=$installroot
        initrd $initrd
    }
    menuentry 'Rescue Mode' {
        linux $vmlinuz inst.stage2=$installroot inst.rescue
        initrd $initrd
    }
}

set installsrc='hd:LABEL=INSTALL:'
set ksdir=/resources/kickstarts

export ksdir
export installsrc

submenu 'Red Hat Enterprise Linux 10' {
    set osroot=/rhel/10
    make_submenu
}
submenu 'Red Hat Enterprise Linux 9' {
    set osroot=/rhel/9
    make_submenu
}
submenu 'Red Hat Enterprise Linux 8' {
    set osroot=/rhel/8
    make_submenu
}
submenu 'Red Hat Enterprise Linux 7' {
    set osroot=/rhel/7
    make_submenu
}
menuentry 'Memtest86+' {
    linux /resources/mt86p_810_x86_64
}
menuentry 'Grub Shell' {
    commandline
}
menuentry 'Reboot' {
    reboot
}

