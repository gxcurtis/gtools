set default=0

insmod normal
insmod all_video
insmod gfxterm
insmod gfxterm_background
insmod regexp
insmod linux
insmod font
insmod png

search --no-floppy --label INSTALL --set=root

set gfxmode=auto
terminal_output gfxterm
loadfont /resources/fonts/jetbrains-mono-24.pf2
background_image /resources/graphics/rocky-background.png

function make_submenu {
    set installroot="${installsrc}${osroot}"
    set vmlinuz="${osroot}/images/pxeboot/vmlinuz"
    set initrd="${osroot}/images/pxeboot/initrd.img"

    export installroot
    export vmlinuz
    export initrd
    
    submenu 'Kickstarts' {
        for ks in $ksdir/*.ks; do
            regexp --set=1:ksfile '^.*/(.*\.ks)$' "$ks"
            menuentry "$ksfile" "${installsrc}${ks}" {
                linux $vmlinuz inst.stage2=$installroot inst.repo=$installroot inst.ks=$2
                initrd $initrd
            }
        done
    }
    menuentry 'Interactive Install' {
        linux $vmlinuz inst.stage2=$installroot inst.repo=$installroot
        initrd $initrd
    }
    menuentry 'Rescue Mode' {
        linux $vmlinuz inst.stage2=$installroot inst.rescue
        initrd $initrd
    }
}

set installsrc='hd:LABEL=INSTALL:'
set ksdir=/resources/kickstarts

export ksdir
export installsrc

submenu 'Rocky Linux 10' {
    set osroot=/rocky/10
    make_submenu
}
submenu 'Rocky Linux 9' {
    set osroot=/rocky/9
    make_submenu
}
submenu 'Rocky Linux 8' {
    set osroot=/rocky/8
    make_submenu
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
menuentry 'Memtest86+' {
    linux /resources/mt86p_810_x86_64
}
menuentry 'Reboot' {
    reboot
}
menuentry 'Power Off' {
    halt
}

