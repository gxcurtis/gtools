---
- name: Setup UX preferences
  hosts: localhost
  become: false
  gather_facts: true
  connection: local
  vars_files:
    - vars/escape_sequences.yml
    - vars/bash_prompts.yml
    - vars/bash_aliases.yml
    - vars/vim.yml
  vars:
    jetbrains_font_version: "2.304"
    jetbrains_font_directory: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/JetBrainsMono-{{ jetbrains_font_version }}"
  tasks:
    - name: Set facts about user
      set_fact:
        u:
          name: "{{ ansible_facts['user_id'] }}"
          home: "{{ ansible_facts['user_dir'] }}"
      tags:
        - always

    - name: Create home .bashrc.d inclusion directory
      file:
        path: "{{ u.home }}/.bashrc.d"
        state: directory
        owner: "{{ u.name }}"
      tags: 
        - offline
    
    - name: Add inclusion logic for custom bash files
      blockinfile:
        block: |
          for x in ~/.bashrc.d/*.bash; do
            . "$x"
          done
        path: "{{ u.home }}/.bashrc"
        state: present
      tags:
        - offline
                
    - name: Add bashrc template files
      template:
        src: templates/{{ item }}.j2
        dest: "{{ u.home }}/.bashrc.d/{{ item }}"
        backup: true
      loop:
        - prompt.bash
        - aliases.bash
        - functions.bash
        - variables.bash
      tags:
        - offline

    - name: Add vimrc config
      template:
        src: templates/vim/vimrc.j2
        dest: "{{ u.home }}/.vimrc"
      tags:
        - offline
    
    - name: Make vim templates directory
      file:
        path: "{{ u.home }}/.vim/templates"
        state: directory
      tags:
        - offline

    - name: Add vim templates
      template:
        src: "templates/vim/{{ item.filename }}"
        dest: "~/.vim/templates/{{ item.filename }}"
      loop: "{{ vim_templates }}"
      tags:
        - offline

    - name: Get package facts
      package_facts:
        manager: auto
      tags:
        - offline

    - name: Add Xterm Xresources
      template:
        src: templates/Xresources.j2
        dest: "{{ u.home }}/.Xresources"
      when: "'xterm' in ansible_facts.packages"
      notify: Merge xrdb
      tags:
        - offline

    - name: Add Jetbrains Mono Font
      when: ansible_facts['system'] == 'Linux'
      block:
      - name: Create font_directory
        file:
          path: "{{ jetbrains_font_directory }}"
          state: directory
          mode: "0755"
        when: ansible_facts['system'] == 'Linux'

      - name: Download and extract JetBrains Mono Font
        unarchive:
          src: https://github.com/JetBrains/JetBrainsMono/releases/download/v{{ jetbrains_font_version }}/JetBrainsMono-{{ jetbrains_font_version }}.zip
          dest: "{{ jetbrains_font_directory }}"
          creates: "{{ jetbrains_font_directory }}/fonts/ttf/JetBrainsMono-Regular.ttf"
          remote_src: true
        notify: Refresh font cache
      tags:
        - online

    - name: Create user dot bin directory
      file:
        state: directory
        path: "{{ u.home }}/.local/bin"
      tags:
        - offline

    - name: Symlink project tools to user dot bin directory
      file:
        src: "{{ item | realpath }}"
        dest: "{{ u.home }}/.local/bin/{{ item | basename | splitext | first }}"
        state: link
      loop:
        - "{{ playbook_dir }}/../ksbuilder/ksbuilder.py"
        - "{{ playbook_dir }}/../buildaboot/build-bootdev.sh"
        - "{{ playbook_dir }}/../setup-ux.sh"
      tags:
        - offline

    - name: Create user bash completions directory
      file:
        state: directory
        path: "{{ u.home }}/.local/share/bash-completion/completions"
      tags:
        - offline

    - name: Generate Python completion scripts
      ansible.builtin.command:
        cmd: "register-python-argcomplete {{ item }}"
      register: argcomplete_scripts
      changed_when: false
      loop:
        - ksbuilder
      tags:
        - offline

    - name: Install Python completion scripts
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ u.home }}/.local/share/bash-completion/completions/{{ item.item }}"
      loop: "{{ argcomplete_scripts.results }}" 
      no_log: true
      tags:
        - offline

  handlers:
    - name: Merge xrdb
      command: xrdb -merge {{ u.home }}/.Xresources 
      tags:
        - offline

    - name: Refresh font cache
      command: fc-cache -f {{ jetbrains_font_directory }}
      tags:
        - offline
