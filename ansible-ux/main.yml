---
- name: Setup UX preferences
  hosts: localhost
  become: false
  gather_facts: true
  connection: local
  tasks:
    - name: Set environment facts
      set_fact:
        user:
          name: "{{ ansible_facts['user_id'] }}"
          home: "{{ ansible_facts['user_dir'] }}"
      tags: always

    - name: Import software tasks
      import_tasks:
        file: tasks/software.yml
      tags: software

    - name: Import tools tasks
      import_tasks:
        file: tasks/tools.yml
      tags: tools

    - name: Import bash tasks
      import_tasks:
        file: tasks/bash.yml
      tags: bash

    - name: Import vim tasks
      import_tasks:
        file: tasks/vim.yml
      tags:
        - vim
        - editor

    - name: Import neovim tasks
      import_tasks:
        file: tasks/neovim.yml
      tags: 
        - neovim
        - editor

    - name: Import xterm tasks
      import_tasks:
        file: tasks/xterm.yml
      tags: xterm

    - name: Import fonts tasks
      include_tasks:
        file: tasks/fonts.yml
      loop:
        - JetBrainsMono
        - Hack
      loop_control:
        loop_var: font
      tags: fonts

