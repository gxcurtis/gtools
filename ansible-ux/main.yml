---
- name: Setup UX preferences
  hosts: localhost
  become: false
  gather_facts: true
  connection: local
  vars_files:
    - vars/escape_sequences.yml
    - vars/bash_prompts.yml
    - vars/bash_aliases.yml
    - vars/vim.yml
  vars:
    tdir: "../templates"
    font_dir: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"

  tasks:
    - name: Set environment facts
      set_fact:
        user:
          name: "{{ ansible_facts['user_id'] }}"
          home: "{{ ansible_facts['user_dir'] }}"
      tags: always

    - name: Import package tasks
      import_tasks:
        file: tasks/packages.yml
      tags: packages

    - name: Import bash tasks
      import_tasks:
        file: tasks/bash.yml
      tags: bash

    - name: Import vim tasks
      import_tasks:
        file: tasks/vim.yml
      tags:
        - vim
        - editor

    - name: Import neovim tasks
      import_tasks:
        file: tasks/neovim.yml
      tags: 
        - neovim
        - editor

    - name: Import xterm tasks
      import_tasks:
        file: tasks/xterm.yml
      tags: xterm

    - name: Import miscellaneous tasks
      import_tasks:
        file: tasks/misc.yml
      tags: misc

  handlers:
    - name: Merge xrdb
      command: xrdb -merge {{ user.home }}/.Xresources 

    - name: Refresh font cache
      command: fc-cache -f {{ jetbrains_font_directory }}
