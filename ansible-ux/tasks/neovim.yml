- name: Create nvim user directory
  file:
    state: directory
    path: "{{ user.home }}/.config/nvim"

- name: Copy init.lua to user nvim directory
  template:
    src: ../templates/neovim/init.lua.j2
    dest: "{{ user.home }}/.config/nvim/init.lua"

- name: Remove init.vim
  file:
    path: "{{ user.home }}/.config/nvim/init.vim"
    state: absent
