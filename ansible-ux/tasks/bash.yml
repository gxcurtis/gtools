- name: Include bash vars
  include_vars:
    file: "{{ playbook_dir }}/vars/{{ item }}.yml"
  loop:
    - escape-sequences
    - bash-prompts
    - bash-aliases
    - bash-variables

- name: Create home .bashrc.d inclusion directory
  file:
    path: "{{ user.home }}/.bashrc.d"
    state: directory
    owner: "{{ user.name }}"
    mode: "0750"

- name: Add inclusion logic for custom bash files
  blockinfile:
    block: |
      for x in ~/.bashrc.d/*.bash; do
        . "$x"
      done
    path: "{{ user.home }}/.bashrc"
    state: present

- name: Add bash prompt template
  template:
    src: templates/prompt.bash.j2
    dest: "{{ user.home }}/.bashrc.d/prompt.bash"
    mode: "0640"

- name: Add bash functions to user environment
  copy:
    src: files/functions.bash
    dest: "{{ user.home }}/.bashrc.d/functions.bash"
    mode: "0640"

- name: Add bash variables to user environment
  copy:
    content: |
      # Extra Bash Variables
      {% for key, value in bash_variables.items() %}
      export {{ key | upper }}={{ value }}
      {% endfor %}
    dest: "{{ user.home }}/.bashrc.d/variables.bash"
    mode: "0640"

- name: Add bash aliases to user environment
  copy:
    content: |
      # Extra Bash Aliases
      {% for group in alias_groups %}
      # {{ group.name }}
      {% for alias in group.aliases %}
      alias {{ alias.name }}='{{ alias.command }}'
      {% endfor %}

      {% endfor %}
    dest: "{{ user.home }}/.bashrc.d/aliases.bash"
    mode: "0640"

