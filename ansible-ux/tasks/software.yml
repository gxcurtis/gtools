- name: Software block
  block:
    - name: Install dnf packages
      become: true
      dnf:
        name: "{{ dnf_packages }}"
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
  rescue:
    - name: Rescue message
      debug:
        msg: "Couldn't install packages"
        
- name: Get package facts
  package_facts:
    manager: auto
  when: ansible_facts['distribution'] != 'MacOSX'

- name: Python3 pip block task
  block:
    - name: Pip install packages
      pip:
        name: "{{ python_packages }}"
        state: present
        extra_args: --user
  rescue:
    - name: Rescue message
      debug:
        msg: "Couldn't pip install packages trying again with explicit executable"

    - name: Pip install packages with executable
      pip:
        name: "{{ python_packages }}"
        state: present
        extra_args: --user
        executable: /usr/bin/pip3
