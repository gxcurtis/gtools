- name: Add vimrc config
  template:
    src: templates/vim/vimrc.j2
    dest: "{{ user.home }}/.vimrc"

- name: Make vim templates directory
  file:
    path: "{{ user.home }}/.vim/templates"
    state: directory

- name: Make vim plugins directory path
  file: 
    path: "{{ vim_plugin_dir }}"
    state: directory
    recurse: true

- name: Add vim templates
  template:
    src: "templates/vim/{{ item.filename }}"
    dest: "~/.vim/templates/{{ item.filename }}"
  loop: "{{ vim_templates }}"

- name: Git clone vim plugins
  git:
    repo: "{{ item.repo_url }}"
    dest: "{{ vim_plugin_dir}}/{{ item.name }}"
  loop: "{{ vim_plugins }}"
