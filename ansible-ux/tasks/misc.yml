- name: Add Jetbrains Mono Font
  when: ansible_facts['system'] == 'Linux'
  block:
  - name: Create font_directory
    file:
      path: "{{ font_dir }}/JetBrainsMono"
      state: directory
      mode: "0755"
    when: ansible_facts['system'] == 'Linux'

  - name: Download and extract JetBrains Mono Font
    unarchive:
      src: "https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip"
      dest: "{{ font_dir }}/JetBrainsMono"
      creates: "{{ font_dir }}/JetBrainsMono/ttf/JetBrainsMono-Regular.ttf"
      remote_src: true
    notify: Refresh font cache
    tags:
      - www

- name: Create user dot bin directory
  file:
    state: directory
    path: "{{ user.home }}/.local/bin"

- name: Symlink project tools to user dot bin directory
  file:
    src: "{{ item | realpath }}"
    dest: "{{ user.home }}/.local/bin/{{ item | basename | splitext | first }}"
    state: link
  loop:
    - "{{ playbook_dir }}/../ksbuilder/ksbuilder.py"
    - "{{ playbook_dir }}/../buildaboot/build-bootdev.sh"
    - "{{ playbook_dir }}/../setup-ux.sh"

