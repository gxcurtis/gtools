set default=0
set timeout=15

insmod normal
insmod all_video
insmod gfxterm
insmod gfxterm_background
insmod regexp
insmod linux
insmod font
insmod png

search --no-floppy --label INSTALL --set=root

set gfxmode=auto
terminal_output gfxterm
loadfont /resources/fonts/jetbrains-mono-16.pf2
background_image /resources/graphics/tux-background.png

set installsrc='hd:LABEL=INSTALL:'
set osroot=/default
set installroot=${installsrc}${osroot}

set vmlinuz=${osroot}/images/pxeboot/vmlinuz
set initrdimg=${osroot}/images/pxeboot/initrd.img
set ksfile=${installsrc}/resources/kickstarts/default.ks

menuentry 'Default' {
    linux $vmlinuz inst.stage2=$installroot inst.repo=$installroot inst.ks=$ksfile
    initrd $initrdimg

} 
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
menuentry 'Memtest86+' {
    linux /resources/mt86p_810_x86_64
}
menuentry 'Reboot' {
    reboot
}
menuentry 'Power Off' {
    halt
}

