---
- name: Setup UX preferences
  hosts: localhost
  become: false
  gather_facts: true
  connection: local
  vars_files:
    - vars/escape_sequences.yml
    - vars/bash_prompts.yml
    - vars/bash_aliases.yml
  tasks:
    - name: Set facts about user
      set_fact:
        u:
          name: "{{ ansible_facts['user_id'] }}"
          home: "{{ ansible_facts['user_dir'] }}"

    - name: Create home .bashrc.d inclusion directory
      file:
        path: "{{ u.home }}/.bashrc.d"
        state: directory
        owner: "{{ u.name }}"
    
    - name: Add inclusion logic for custom bash files
      blockinfile:
        block: |
          for x in ~/.bashrc.d/*.bash; do
            . "$x"
          done
        path: "{{ u.home }}/.bashrc"
        state: present
                
    - name: Add bashrc template files
      template:
        src: templates/{{ item }}.j2
        dest: "{{ u.home }}/.bashrc.d/{{ item }}"
        backup: true
      loop:
        - prompt.bash
        - aliases.bash
        - functions.bash
        - variables.bash

    - name: Add vimrc config
      template:
        src: templates/vim/vimrc.j2
        dest: "{{ u.home }}/.vimrc"
    
    - name: Make vim templates directory
      file:
        path: "{{ u.home }}/.vim/templates"
        state: directory

    - name: Add vim templates
      template:
        src: "templates/vim/{{ item.filename }}.j2"
        dest: "~/.vim/templates/{{ item.filename }}"
      loop: "{{ vim_templates }}"

